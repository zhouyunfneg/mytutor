<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="320" rx="18" fill="#f1eee6"/>
  <text x="36" y="44" font-size="20" font-weight="700" fill="#262219">微知识点教学循环</text>
  <text x="36" y="68" font-size="12" fill="#9a9287">一次只学一个最小知识点；你点按钮才前进，反对知识灌输</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#5c564e" stroke-width="1.5"/>
    </marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#6d8a77" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 五个节点 -->
  <g>
    <rect x="36" y="110" width="150" height="76" rx="12" fill="#fbf9f3" stroke="#b3705f" stroke-width="1.6"/>
    <text x="60" y="140" font-size="15" font-weight="700" fill="#9d5f50">讲解</text>
    <text x="60" y="162" font-size="11" fill="#5c564e">最小点 + 一个示例</text>
    <text x="60" y="178" font-size="11" fill="#5c564e">零基础四段式</text>

    <rect x="222" y="110" width="150" height="76" rx="12" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1.5"/>
    <text x="246" y="140" font-size="15" font-weight="700" fill="#262219">出题</text>
    <text x="246" y="162" font-size="11" fill="#5c564e">动手小题 / 概念选择</text>
    <text x="246" y="178" font-size="11" fill="#5c564e">只考讲过的语法</text>

    <rect x="408" y="110" width="150" height="76" rx="12" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1.5"/>
    <text x="432" y="140" font-size="15" font-weight="700" fill="#262219">纠错</text>
    <text x="432" y="162" font-size="11" fill="#9d5f50">只给方向性提示</text>
    <text x="432" y="178" font-size="11" fill="#9d5f50">绝不给答案</text>

    <rect x="594" y="110" width="150" height="76" rx="12" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1.5"/>
    <text x="618" y="140" font-size="15" font-weight="700" fill="#262219">巩固</text>
    <text x="618" y="162" font-size="11" fill="#5c564e">换一道变式题</text>
    <text x="618" y="178" font-size="11" fill="#5c564e">同范围再练一次</text>

    <rect x="780" y="110" width="150" height="76" rx="12" fill="#6d8a77" opacity="0.16" stroke="#6d8a77" stroke-width="1.6"/>
    <text x="804" y="140" font-size="15" font-weight="700" fill="#5c7a67">下一个点</text>
    <text x="804" y="162" font-size="11" fill="#5c7a67">用户手动推进</text>
    <text x="804" y="178" font-size="11" fill="#5c7a67">进度记录服务器</text>
  </g>

  <!-- 前进箭头 -->
  <line x1="186" y1="148" x2="216" y2="148" stroke="#5c564e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="372" y1="148" x2="402" y2="148" stroke="#5c564e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="558" y1="148" x2="588" y2="148" stroke="#5c564e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="744" y1="148" x2="774" y2="148" stroke="#6d8a77" stroke-width="1.5" marker-end="url(#arp)"/>
  <text x="376" y="100" font-size="10" fill="#9a9287">做错</text>
  <text x="562" y="100" font-size="10" fill="#9a9287">改对</text>
  <text x="748" y="100" font-size="10" fill="#5c7a67">两题都判对</text>

  <!-- 纠错回环：提示后回去再提交 -->
  <path d="M 483 186 L 483 216 L 297 216 L 297 192" fill="none" stroke="#b3705f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="330" y="232" font-size="10" fill="#9d5f50">带着提示回去改，再提交</text>

  <!-- 下一点回环 -->
  <path d="M 855 186 L 855 262 L 111 262 L 111 192" fill="none" stroke="#6d8a77" stroke-width="1.4" marker-end="url(#arp)"/>
  <text x="400" y="256" font-size="10" fill="#5c7a67">进入下一个微知识点，循环继续</text>

  <!-- 总结分支 -->
  <rect x="36" y="284" width="894" height="1" fill="#d6cfc2"/>
  <text x="36" y="306" font-size="11" fill="#5c564e">走完一个小节 → 小节小总结；走完一个模块 → 模块大总结；总结自动存进笔记，供间隔复习。</text>
</svg>
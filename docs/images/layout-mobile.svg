    <circle cx="668" cy="332" r="4" fill="#9a9287"/>
    <text x="682" y="337">safe-area 适配刘海屏 / home 指示条</text>
    <circle cx="668" cy="368" r="4" fill="#9a9287"/>
    <text x="682" y="373">PWA：可添加到主屏幕，断网可开界面</text>
  </g>

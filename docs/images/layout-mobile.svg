  <text x="394" y="210" font-size="10" font-family="'Cascadia Code',Consolas,monospace" fill="#e8e4d8">x = 2</text>
  <text x="378" y="228" font-size="10" font-family="'Cascadia Code',Consolas,monospace" fill="#9a9287">2</text>
  <text x="394" y="228" font-size="10" font-family="'Cascadia Code',Consolas,monospace" fill="#e8e4d8">print(x)</text>
  <rect x="366" y="374" width="222" height="34" rx="9" fill="#f4f1e9" stroke="#d6cfc2"/>
  <g font-size="10" fill="#9a9287">
    <text x="386" y="395" fill="#9d5f50">学习</text>
    <text x="440" y="395">练习</text>
    <text x="494" y="395">笔记</text>
    <text x="548" y="395">我的</text>
  </g>
  <text x="404" y="440" font-size="11" fill="#5c564e">代码区态：切页签不丢已写内容</text>

  <!-- 右侧要点 -->
  <g font-size="12" fill="#5c564e">
    <circle cx="668" cy="116" r="4" fill="#b3705f"/>
    <text x="682" y="121">底部四页签常驻，练习带待复习徽标</text>
    <circle cx="668" cy="152" r="4" fill="#b3705f"/>
    <text x="682" y="157">讲解 / 代码区分段页签，两面板保持挂载</text>

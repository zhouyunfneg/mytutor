  <text x="78" y="348" font-size="10" fill="#5c564e">阅读区拿到几乎整屏高度</text>
  <rect x="66" y="374" width="222" height="34" rx="9" fill="#f4f1e9" stroke="#d6cfc2"/>
  <g font-size="10" fill="#9a9287">
    <text x="86" y="395" fill="#9d5f50">学习</text>
    <text x="140" y="395">练习</text>
    <text x="194" y="395">笔记</text>
    <text x="248" y="395">我的</text>
  </g>
  <circle cx="152" cy="381" r="6" fill="#b3705f"/>
  <text x="149" y="385" font-size="8" fill="#fbf9f3">2</text>
  <text x="112" y="440" font-size="11" fill="#5c564e">讲解态：长文上下滑读</text>

  <!-- 手机二：代码区态 -->
  <rect x="352" y="92" width="250" height="330" rx="22" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1.5"/>
  <rect x="366" y="106" width="222" height="34" rx="9" fill="#e8e4d8"/>
  <text x="376" y="128" font-size="11" fill="#5c564e">‹ 书架</text>
  <text x="440" y="128" font-size="12" font-weight="700" fill="#262219">Python</text>
  <text x="544" y="128" font-size="11" fill="#5c564e">目录</text>
  <rect x="366" y="148" width="222" height="30" rx="9" fill="#e8e4d8" opacity="0.6"/>

  <rect x="52" y="92" width="250" height="330" rx="22" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1.5"/>
  <rect x="66" y="106" width="222" height="34" rx="9" fill="#e8e4d8"/>
